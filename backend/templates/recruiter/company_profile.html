{% extends 'base.html' %}

{% block title %}Company Profile - JobSphere{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 20px auto;">
    <div class="form-card">
        <h2 style="margin-bottom: 6px; font-weight: 800; text-align: center;">Company Profile</h2>
        <p style="color: var(--text-muted); text-align: center; margin-bottom: 28px; font-size: 0.95rem;">Manage how your company appears to candidates.</p>

        <form action="{{ url_for('company_profile') }}" method="POST">
            
            <div class="form-group">
                <label class="form-label" for="company_name">Company Name *</label>
                <input type="text" id="company_name" name="company_name" value="{{ company.company_name if company else '' }}" class="form-control" placeholder="e.g. TechCorp AI" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label" for="website">Company Website</label>
                    <input type="url" id="website" name="website" value="{{ company.website if company else '' }}" class="form-control" placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="location">Headquarters Location</label>
                    <input type="text" id="location" name="location" value="{{ company.location if company else '' }}" class="form-control" placeholder="San Francisco, CA">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Company Description & Mission</label>
                <textarea id="description" name="description" class="form-control" placeholder="Introduce your company culture, technology stack, and mission..." style="min-height: 140px;">{{ company.description if company else '' }}</textarea>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 28px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Company Details</button>
                <a href="{{ url_for('recruiter_dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
