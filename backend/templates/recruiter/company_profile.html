{% extends 'base.html' %}

{% block title %}Company Profile - JobSphere{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 20px auto;">
    <div class="form-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
            <div style="flex: 1;">
                <h2 style="margin-bottom: 4px; font-weight: 800;">Company Profile</h2>
                <p style="color: var(--text-muted); margin: 0; font-size: 0.95rem;">Manage how your company appears to candidates.</p>
            </div>
            <a href="{{ url_for('recruiter_dashboard') }}" title="Close Company Profile" style="color: var(--text-muted); font-size: 2rem; line-height: 1; text-decoration: none; padding: 2px 10px; border-radius: 8px; background: rgba(255,255,255,0.05); margin-left: 12px; transition: all 0.2s;" onmouseover="this.style.color='#FFF'; this.style.background='rgba(255,255,255,0.15)';" onmouseout="this.style.color='var(--text-muted)'; this.style.background='rgba(255,255,255,0.05)';">&times;</a>
        </div>

        <form id="companyProfileForm" action="{{ url_for('company_profile') }}" method="POST">
            
            <div class="form-group">
                <label class="form-label" for="company_name">Company Name *</label>
                <input type="text" id="company_name" name="company_name" value="{{ (company.company_name if company else '') or session.get('company_data', {}).get('company_name', '') }}" class="form-control" placeholder="e.g. TechCorp AI" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label" for="website">Company Website</label>
                    <input type="url" id="website" name="website" value="{{ (company.website if company else '') or session.get('company_data', {}).get('website', '') }}" class="form-control" placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="location">Headquarters Location</label>
                    <input type="text" id="location" name="location" value="{{ (company.location if company else '') or session.get('company_data', {}).get('location', '') }}" class="form-control" placeholder="San Francisco, CA">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Company Description & Mission</label>
                <textarea id="description" name="description" class="form-control" placeholder="Introduce your company culture, technology stack, and mission..." style="min-height: 140px;">{{ (company.description if company else '') or session.get('company_data', {}).get('description', '') }}</textarea>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap;">
                <button type="submit" name="action" value="save_and_close" id="saveCloseCompanyBtn" class="btn btn-primary" style="flex: 2; font-weight: 700; padding: 12px 20px;">
                    <i class="fa-solid fa-circle-check"></i> Save & Close Profile
                </button>
                <button type="submit" name="action" value="save_and_stay" id="saveStayCompanyBtn" class="btn btn-secondary" style="flex: 1; padding: 12px 16px;">
                    <i class="fa-solid fa-floppy-disk"></i> Save & Stay
                </button>
                <a href="{{ url_for('recruiter_dashboard') }}" class="btn btn-secondary" style="padding: 12px 20px;">
                    <i class="fa-solid fa-xmark"></i> Close
                </a>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('companyProfileForm');
    if (!form) return;

    const fields = ['company_name', 'website', 'location', 'description'];

    try {
        const stored = JSON.parse(localStorage.getItem('company_profile_cache') || '{}');
        fields.forEach(field => {
            const el = document.getElementById(field);
            if (el && (!el.value || el.value.trim() === '') && stored[field]) {
                el.value = stored[field];
            }
        });
    } catch (err) {
        console.debug('LocalStorage read notice:', err);
    }

    function persistForm() {
        try {
            const data = {};
            fields.forEach(field => {
                const el = document.getElementById(field);
                if (el) data[field] = el.value.trim();
            });
            localStorage.setItem('company_profile_cache', JSON.stringify(data));
        } catch (err) {
            console.debug('LocalStorage write notice:', err);
        }
    }

    form.addEventListener('submit', function() {
        persistForm();
        const clickedBtn = document.activeElement;
        if (clickedBtn && clickedBtn.id === 'saveStayCompanyBtn') {
            clickedBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
        } else {
            const mainBtn = document.getElementById('saveCloseCompanyBtn');
            if (mainBtn) {
                mainBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving & Closing...';
            }
        }
    });

    fields.forEach(field => {
        const el = document.getElementById(field);
        if (el) {
            el.addEventListener('input', persistForm);
            el.addEventListener('change', persistForm);
            el.addEventListener('blur', persistForm);
        }
    });
});
</script>
{% endblock %}
