<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .node-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #94a3b8; }
    .pulse-dot { animation: moveDot 3s linear infinite; }
    @keyframes moveDot {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }
  </style>

  <rect width="1000" height="240" rx="14" fill="#0b0f19" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Connecting Streamlines -->
  <path d="M 180 120 L 320 120" stroke="url(#flowGrad)" stroke-width="2.5" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite" />
  </path>
  <path d="M 480 120 L 620 120" stroke="url(#flowGrad)" stroke-width="2.5" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite" />
  </path>
  <path d="M 780 120 L 880 120" stroke="url(#flowGrad)" stroke-width="2.5" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite" />
  </path>

  <!-- Node 1: Candidate / Recruiter -->
  <g transform="translate(40, 75)">
    <rect width="140" height="90" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="70" cy="30" r="14" fill="#818cf8" opacity="0.3" />
    <text x="70" y="35" text-anchor="middle" font-size="16">👥</text>
    <text x="70" y="58" text-anchor="middle" class="node-title">Client UI</text>
    <text x="70" y="74" text-anchor="middle" class="node-sub">Candidate / Recruiter</text>
  </g>

  <!-- Node 2: React 19 Frontend -->
  <g transform="translate(320, 75)">
    <rect width="160" height="90" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="80" cy="30" r="14" fill="#c084fc" opacity="0.3" />
    <text x="80" y="35" text-anchor="middle" font-size="16">⚛️</text>
    <text x="80" y="58" text-anchor="middle" class="node-title">React 19 + Vite</text>
    <text x="80" y="74" text-anchor="middle" class="node-sub">Port 5173 • SPA Router</text>
  </g>

  <!-- Node 3: Flask Backend REST API -->
  <g transform="translate(620, 75)">
    <rect width="160" height="90" rx="12" fill="#111827" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="80" cy="30" r="14" fill="#22d3ee" opacity="0.3" />
    <text x="80" y="35" text-anchor="middle" font-size="16">⚡</text>
    <text x="80" y="58" text-anchor="middle" class="node-title">Flask Server</text>
    <text x="80" y="74" text-anchor="middle" class="node-sub">Port 5000 • REST / Auth</text>
  </g>

  <!-- Node 4: SQLite Database & Services -->
  <g transform="translate(880, 75)">
    <rect width="90" height="90" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="45" cy="30" r="14" fill="#34d399" opacity="0.3" />
    <text x="45" y="35" text-anchor="middle" font-size="16">💾</text>
    <text x="45" y="58" text-anchor="middle" class="node-title">DB / Mail</text>
    <text x="45" y="74" text-anchor="middle" class="node-sub">SQLAlchemy</text>
  </g>
</svg>
