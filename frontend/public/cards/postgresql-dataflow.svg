<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="580">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <!-- Animated Multi-Color Neon Border -->
    <linearGradient id="dfBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#6366f1;#ec4899;#00e676;#00f0ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#00e676;#00f0ff;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#00e676;#00f0ff;#6366f1;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00e676">
        <animate attributeName="stop-color" values="#00e676;#00f0ff;#6366f1;#ec4899;#00e676" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Node Header Gradients -->
    <linearGradient id="gClient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="gFlask" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="gPool" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="gPg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="gReturn" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#db2777"/><stop offset="100%" stop-color="#e11d48"/></linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00f0ff" />
    </marker>
    <marker id="arrIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00e676" />
    </marker>
    <marker id="arrPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6" />
    </marker>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Fira+Code:wght@500;600;700&amp;display=swap');

    .flow-title { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .box-hdr { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 800; fill: #ffffff; }
    .box-sub { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: 600; fill: #94a3b8; }
    .desc-text { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500; fill: #cbd5e1; }
    .chip-code { font-family: 'Fira Code', monospace; font-size: 9.5px; font-weight: 700; }

    /* Animated CSS Dash Flows */
    .flow-cyan {
      stroke: #00f0ff;
      stroke-width: 2.2;
      stroke-dasharray: 7,4;
      animation: flowRun 1.2s linear infinite;
    }
    .flow-indigo {
      stroke: #818cf8;
      stroke-width: 2.2;
      stroke-dasharray: 7,4;
      animation: flowRun 1.2s linear infinite;
    }
    .flow-green {
      stroke: #00e676;
      stroke-width: 2.5;
      stroke-dasharray: 7,4;
      animation: flowRun 1.1s linear infinite;
    }
    .flow-pink {
      stroke: #f472b6;
      stroke-width: 2.2;
      stroke-dasharray: 7,4;
      animation: flowReverse 1.2s linear infinite;
    }

    @keyframes flowRun {
      from { stroke-dashoffset: 22; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowReverse {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 22; }
    }

    /* Glowing Pulse Nodes */
    .pulse-glow-cyan { animation: glowCyan 2s ease-in-out infinite alternate; }
    .pulse-glow-green { animation: glowGreen 2s ease-in-out infinite alternate; }
    .pulse-glow-pink { animation: glowPink 2s ease-in-out infinite alternate; }

    @keyframes glowCyan {
      0% { filter: drop-shadow(0 0 2px #00f0ff); opacity: 0.7; }
      100% { filter: drop-shadow(0 0 10px #00f0ff); opacity: 1; }
    }
    @keyframes glowGreen {
      0% { filter: drop-shadow(0 0 2px #00e676); opacity: 0.7; }
      100% { filter: drop-shadow(0 0 12px #00e676); opacity: 1; }
    }
    @keyframes glowPink {
      0% { filter: drop-shadow(0 0 2px #ec4899); opacity: 0.7; }
      100% { filter: drop-shadow(0 0 10px #ec4899); opacity: 1; }
    }

    /* Signal Packet Animation */
    .packet-ball {
      animation: packetMove 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes packetMove {
      0% { transform: translate(0, 0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(750px, 0); opacity: 0; }
    }
  </style>

  <!-- Card Background & Border -->
  <rect width="1000" height="580" rx="18" fill="url(#dfBg)" stroke="url(#dfBorder)" stroke-width="2" />

  <!-- Top Title Header -->
  <g transform="translate(30, 20)">
    <rect width="560" height="28" rx="14" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#00f0ff" class="pulse-glow-cyan" />
    <text x="32" y="18" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#a5f3fc">POSTGRESQL SERVERLESS DATA FLOW &amp; CONNECTION POOLING</text>
  </g>

  <!-- Top Right Badges -->
  <g transform="translate(680, 20)">
    <rect width="135" height="26" rx="13" fill="rgba(0, 230, 118, 0.15)" stroke="#00e676" stroke-width="1" />
    <text x="67" y="17" text-anchor="middle" class="chip-code" fill="#69f0ae">⚡ pool_pre_ping</text>
    <g transform="translate(145, 0)">
      <rect width="135" height="26" rx="13" fill="rgba(244, 114, 182, 0.15)" stroke="#f472b6" stroke-width="1" />
      <text x="67" y="17" text-anchor="middle" class="chip-code" fill="#fbcfe8">🔄 pool_recycle=300</text>
    </g>
  </g>

  <!-- ================= HORIZONTAL DATA FLOW PIPELINE ================= -->

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 215 150 L 265 150" class="flow-cyan" marker-end="url(#arrCyan)" fill="none" />
  <!-- Flow Connector 2 -> 3 -->
  <path d="M 465 150 L 515 150" class="flow-indigo" marker-end="url(#arrIndigo)" fill="none" />
  <!-- Flow Connector 3 -> 4 -->
  <path d="M 715 150 L 765 150" class="flow-green" marker-end="url(#arrGreen)" fill="none" />

  <!-- Return Flow Connector (Bottom Highway 4 -> 1) -->
  <path d="M 870 230 C 870 280, 870 290, 870 300 L 125 300 C 125 280, 125 240, 125 230" class="flow-pink" marker-end="url(#arrPink)" fill="none" />

  <!-- ================= STAGE 1: CLIENT TRIGGER ================= -->
  <g transform="translate(35, 75)">
    <rect width="180" height="150" rx="12" fill="#0c172a" stroke="#0284c7" stroke-width="1.5" />
    <rect width="180" height="32" rx="12" fill="url(#gClient)" />
    <text x="90" y="21" text-anchor="middle" class="box-hdr">1. Client Trigger</text>

    <text x="14" y="54" class="box-sub">React 19 / Jinja2</text>
    <text x="14" y="74" class="desc-text">• 1-Click Apply (Resume)</text>
    <text x="14" y="92" class="desc-text">• Post Tech Vacancy</text>
    <text x="14" y="110" class="desc-text">• Interview Scheduler</text>
    <text x="14" y="128" class="desc-text">• Status Progression</text>

    <circle cx="165" cy="16" r="4" fill="#38bdf8" class="pulse-glow-cyan" />
  </g>

  <!-- ================= STAGE 2: FLASK REST ENGINE & URI REWRITE ================= -->
  <g transform="translate(265, 75)">
    <rect width="200" height="150" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <rect width="200" height="32" rx="12" fill="url(#gFlask)" />
    <text x="100" y="21" text-anchor="middle" class="box-hdr">2. WSGI &amp; Normalizer</text>

    <text x="14" y="54" class="box-sub">Vercel Edge / Flask 3.0</text>
    <text x="14" y="74" class="desc-text">• Read DATABASE_URL</text>
    <rect x="14" y="80" width="172" height="22" rx="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="0.8" />
    <text x="20" y="94" class="chip-code" fill="#c7d2fe">postgres:// → postgresql://</text>
    <text x="14" y="120" class="desc-text">• SQLAlchemy 2.0 Patch</text>
    <text x="14" y="136" class="desc-text">• Parameter Sanitization</text>

    <circle cx="185" cy="16" r="4" fill="#a5b4fc" />
  </g>

  <!-- ================= STAGE 3: RESILIENT CONNECTION POOL ================= -->
  <g transform="translate(515, 75)">
    <rect width="200" height="150" rx="12" fill="#061f18" stroke="#10b981" stroke-width="1.8" />
    <rect width="200" height="32" rx="12" fill="url(#gPool)" />
    <text x="100" y="21" text-anchor="middle" class="box-hdr">3. Resilient Pool Guard</text>

    <text x="14" y="54" class="box-sub">pool_pre_ping: True</text>
    <text x="14" y="72" class="desc-text">⚡ Emits 'SELECT 1' ping</text>
    <text x="14" y="88" class="desc-text">🛡️ Revives dropped sockets</text>
    <text x="14" y="108" class="box-sub">pool_recycle: 300s</text>
    <text x="14" y="124" class="desc-text">🔄 5-min timeout recycle</text>
    <text x="14" y="140" class="desc-text">❄️ Handles cold starts</text>

    <circle cx="185" cy="16" r="4" fill="#69f0ae" class="pulse-glow-green" />
  </g>

  <!-- ================= STAGE 4: MANAGED POSTGRESQL CLOUD ================= -->
  <g transform="translate(765, 75)">
    <rect width="200" height="150" rx="12" fill="#08142c" stroke="#3b82f6" stroke-width="1.8" />
    <rect width="200" height="32" rx="12" fill="url(#gPg)" />
    <text x="100" y="21" text-anchor="middle" class="box-hdr">4. Cloud PostgreSQL</text>

    <text x="14" y="54" class="box-sub">Neon / Supabase / RDS</text>
    <text x="14" y="74" class="desc-text">🔒 TLS 1.3 sslmode=require</text>
    <text x="14" y="92" class="desc-text">💾 ACID Transaction Commit</text>
    <text x="14" y="110" class="desc-text">📄 Resume Binary Persistence</text>
    <text x="14" y="128" class="desc-text">⚡ Foreign Key Cascade Sync</text>

    <circle cx="185" cy="16" r="4" fill="#60a5fa" class="pulse-glow-cyan" />
  </g>

  <!-- Stage 4 return tag -->
  <g transform="translate(430, 285)">
    <rect width="230" height="28" rx="14" fill="#1e1026" stroke="#f472b6" stroke-width="1.2" />
    <text x="115" y="18" text-anchor="middle" class="chip-code" fill="#f472b6">⬅️ 5. Zero-Latency JSON Response</text>
  </g>

  <!-- ================= LOWER DEEP-DIVE: THREE INTERACTIVE PILLARS ================= -->
  
  <!-- Pillar A: Pre-Ping Ping Mechanism -->
  <g transform="translate(35, 340)">
    <rect width="295" height="205" rx="12" fill="#0b1329" stroke="#0284c7" stroke-width="1" />
    <path d="M 0 0 L 295 0 L 295 28 L 0 28 Z" fill="rgba(2, 132, 199, 0.25)" rx="12" />
    <text x="16" y="19" class="box-hdr" fill="#38bdf8">🔍 Step A: pool_pre_ping Heartbeat</text>
    
    <g transform="translate(14, 42)">
      <text x="0" y="14" class="desc-text">Serverless containers can be paused.</text>
      <text x="0" y="32" class="desc-text">When paused, cloud firewalls drop TCP sockets.</text>
      
      <rect y="44" width="267" height="42" rx="6" fill="#07172e" stroke="#0284c7" stroke-width="0.8" />
      <text x="10" y="62" class="chip-code" fill="#7dd3fc">ping → SELECT 1</text>
      <text x="10" y="78" class="desc-text" fill="#93c5fd">If closed → creates fresh TCP socket instantly</text>
      
      <text x="0" y="110" class="desc-text">✅ Prevents "SSL connection has been closed</text>
      <text x="0" y="126" class="desc-text">   unexpectedly" 500 runtime crash.</text>
      <text x="0" y="146" class="chip-code" fill="#00e676">Result: 99.99% Serverless Uptime</text>
    </g>
  </g>

  <!-- Pillar B: 5-Minute Session Recycling -->
  <g transform="translate(350, 340)">
    <rect width="295" height="205" rx="12" fill="#140f26" stroke="#8b5cf6" stroke-width="1" />
    <path d="M 0 0 L 295 0 L 295 28 L 0 28 Z" fill="rgba(139, 92, 246, 0.25)" rx="12" />
    <text x="16" y="19" class="box-hdr" fill="#c084fc">⏱️ Step B: pool_recycle (300s)</text>

    <g transform="translate(14, 42)">
      <text x="0" y="14" class="desc-text">Cloud database proxies (e.g. AWS PgBouncer,</text>
      <text x="0" y="32" class="desc-text">Neon, Supabase) enforce an idle timeout.</text>

      <rect y="44" width="267" height="42" rx="6" fill="#1c0f38" stroke="#8b5cf6" stroke-width="0.8" />
      <text x="10" y="62" class="chip-code" fill="#e9d5ff">max_age = 300 seconds</text>
      <text x="10" y="78" class="desc-text" fill="#d8b4fe">Connections gracefully retired before cloud kills</text>

      <text x="0" y="110" class="desc-text">✅ Zero stale connection accumulation.</text>
      <text x="0" y="126" class="desc-text">✅ Eliminates memory leaks across micro-containers.</text>
      <text x="0" y="146" class="chip-code" fill="#c084fc">Result: Clean Socket Lifecycle</text>
    </g>
  </g>

  <!-- Pillar C: Zero-Config Local SQLite Mode -->
  <g transform="translate(665, 340)">
    <rect width="300" height="205" rx="12" fill="#07201a" stroke="#10b981" stroke-width="1" />
    <path d="M 0 0 L 300 0 L 300 28 L 0 28 Z" fill="rgba(16, 185, 129, 0.25)" rx="12" />
    <text x="16" y="19" class="box-hdr" fill="#34d399">🗄️ Step C: Offline SQLite Fallback</text>

    <g transform="translate(14, 42)">
      <text x="0" y="14" class="desc-text">No DATABASE_URL provided? No problem!</text>
      <text x="0" y="32" class="desc-text">Seamless fallback to SQLite 3 in 0 ms.</text>

      <rect y="44" width="272" height="42" rx="6" fill="#062e24" stroke="#10b981" stroke-width="0.8" />
      <text x="10" y="62" class="chip-code" fill="#6ee7b7">sqlite:///job_portal.db</text>
      <text x="10" y="78" class="desc-text" fill="#a7f3d0">Automated seeder populates 10+ jobs &amp; users</text>

      <text x="0" y="110" class="desc-text">✅ 100% offline development ready.</text>
      <text x="0" y="126" class="desc-text">✅ Single codebase, zero SQL dialect drift.</text>
      <text x="0" y="146" class="chip-code" fill="#10b981">Result: Zero-Setup Developer Speed</text>
    </g>
  </g>
</svg>
