<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="100%" height="290">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="credBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <!-- Animated Multi-Color Border -->
    <linearGradient id="credBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#38bdf8;#6366f1;#ec4899;#10b981" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#6366f1;#ec4899;#10b981;#38bdf8" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#10b981;#38bdf8;#6366f1" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=Fira+Code:wght@600;700&amp;display=swap');

    .role-title { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 800; fill: #ffffff; }
    .cred-label { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .cred-val { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .feat-item { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #cbd5e1; }
    
    .glow-dot { animation: glowAnim 2s infinite ease-in-out; }
    @keyframes glowAnim {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Container -->
  <rect width="1000" height="290" rx="18" fill="url(#credBg)" stroke="url(#credBorder)" stroke-width="2" />

  <!-- Top Banner Title -->
  <g transform="translate(30, 18)">
    <rect width="470" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#34d399" class="glow-dot" />
    <text x="32" y="19" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#a7f3d0">🔐 PRE-SEEDED DEMO TEST CREDENTIALS</text>
  </g>

  <!-- Right Pill: Universal Password -->
  <g transform="translate(710, 18)">
    <rect width="260" height="28" rx="14" fill="rgba(251, 191, 36, 0.15)" stroke="#f59e0b" stroke-width="1" />
    <text x="16" y="18" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#fef08a">🔑 Universal Pass: </text>
    <rect x="150" y="5" width="98" height="18" rx="5" fill="#f59e0b" />
    <text x="199" y="18" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="800" fill="#0f172a">password123</text>
  </g>

  <!-- ================= 2 ROLE CARDS ================= -->

  <!-- ROLE 1: RECRUITER (Left Card) -->
  <g transform="translate(30, 62)">
    <rect width="455" height="205" rx="14" fill="rgba(99, 102, 241, 0.05)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.2" />
    <rect width="455" height="4" rx="2" fill="#6366f1" />

    <g transform="translate(20, 18)">
      <!-- Avatar & Title -->
      <rect width="36" height="36" rx="8" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1" />
      <text x="18" y="24" text-anchor="middle" font-size="18">🏢</text>
      
      <text x="48" y="16" class="role-title">Recruiter Account</text>
      <rect x="48" y="22" width="130" height="16" rx="4" fill="rgba(99, 102, 241, 0.2)" />
      <text x="113" y="33" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#c7d2fe">RECRUITER PORTAL</text>

      <!-- Email 1 & 2 -->
      <g transform="translate(0, 48)">
        <rect width="415" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        
        <text x="14" y="20" class="cred-label">Login Emails</text>
        <text x="14" y="36" class="cred-val" fill="#818cf8">recruiter@techcorp.io</text>
        <text x="215" y="36" class="cred-val" fill="#94a3b8">|</text>
        <text x="235" y="36" class="cred-val" fill="#a5b4fc">jobs@innovatelabs.com</text>
      </g>

      <!-- Features Pill Matrix -->
      <g transform="translate(0, 106)">
        <text x="0" y="10" class="cred-label">Unlocked Capabilities:</text>
        
        <g transform="translate(0, 18)">
          <rect width="195" height="22" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="0.7" />
          <text x="12" y="15" class="feat-item" fill="#e0e7ff">⚡ Full 6-Stage ATS Kanban</text>

          <rect x="205" width="210" height="22" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="0.7" />
          <text x="217" y="15" class="feat-item" fill="#d1fae5">🎯 Live Candidate ATS Scoring</text>
        </g>
        <g transform="translate(0, 46)">
          <rect width="195" height="22" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="0.7" />
          <text x="12" y="15" class="feat-item" fill="#fef3c7">📧 Calendar Invite Emailer</text>

          <rect x="205" width="210" height="22" rx="6" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="0.7" />
          <text x="217" y="15" class="feat-item" fill="#fce7f3">📝 Vacancy &amp; Notes Management</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ROLE 2: JOB SEEKER (Right Card) -->
  <g transform="translate(515, 62)">
    <rect width="455" height="205" rx="14" fill="rgba(56, 189, 248, 0.05)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
    <rect width="455" height="4" rx="2" fill="#38bdf8" />

    <g transform="translate(20, 18)">
      <!-- Avatar & Title -->
      <rect width="36" height="36" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1" />
      <text x="18" y="24" text-anchor="middle" font-size="18">👤</text>
      
      <text x="48" y="16" class="role-title">Job Seeker Account</text>
      <rect x="48" y="22" width="130" height="16" rx="4" fill="rgba(56, 189, 248, 0.2)" />
      <text x="113" y="33" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#bae6fd">CANDIDATE PORTAL</text>

      <!-- Email 1 & 2 -->
      <g transform="translate(0, 48)">
        <rect width="415" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        
        <text x="14" y="20" class="cred-label">Login Emails</text>
        <text x="14" y="36" class="cred-val" fill="#38bdf8">john.doe@gmail.com</text>
        <text x="200" y="36" class="cred-val" fill="#94a3b8">|</text>
        <text x="215" y="36" class="cred-val" fill="#7dd3fc">nivedreddy6@gmail.com</text>
      </g>

      <!-- Features Pill Matrix -->
      <g transform="translate(0, 106)">
        <text x="0" y="10" class="cred-label">Unlocked Capabilities:</text>
        
        <g transform="translate(0, 18)">
          <rect width="195" height="22" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="0.7" />
          <text x="12" y="15" class="feat-item" fill="#e0f2fe">🔍 Smart Job Discovery Feed</text>

          <rect x="205" width="210" height="22" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="0.7" />
          <text x="217" y="15" class="feat-item" fill="#f3e8ff">⚡ 1-Click ATS Applications</text>
        </g>
        <g transform="translate(0, 46)">
          <rect width="195" height="22" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="0.7" />
          <text x="12" y="15" class="feat-item" fill="#d1fae5">📊 Live Status Tracking</text>

          <rect x="205" width="210" height="22" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="0.7" />
          <text x="217" y="15" class="feat-item" fill="#cffafe">📄 Resume &amp; Profile Manager</text>
        </g>
      </g>
    </g>
  </g>

</svg>
