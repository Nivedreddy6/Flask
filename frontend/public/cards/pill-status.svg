<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 34" width="360" height="34">
  <defs>
    <linearGradient id="pillStBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <style>
    .pulse-dot { animation: pAnim 2s infinite ease-in-out; }
    @keyframes pAnim { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
  <rect x="1" y="1" width="358" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="url(#pillStBorder)" stroke-width="1.4" />
  <circle cx="20" cy="17" r="5" fill="#34d399" class="pulse-dot" />
  <text x="38" y="21" font-family="'Fira Code', monospace, Consolas" font-size="12" font-weight="700" fill="#a7f3d0">● PRODUCTION LIVE ON VERCEL</text>
