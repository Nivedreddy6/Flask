<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Card 1 Gradients -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="border1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Card 2 Gradients -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="border2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Card 3 Gradients -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="border3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 500; fill: #cbd5e1; line-height: 1.5; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }
  </style>

  <!-- ================= CARD 1 ================= -->
  <g transform="translate(10, 10)">
    <rect width="310" height="215" rx="16" fill="url(#card1Grad)" stroke="url(#border1Grad)" stroke-width="2" />
    
    <!-- Top icon circle -->
    <circle cx="45" cy="45" r="22" fill="rgba(99, 102, 241, 0.25)" stroke="#6366f1" stroke-width="1.5" />
    <text x="45" y="52" text-anchor="middle" font-size="20">🎯</text>
    
    <!-- Badge -->
    <rect x="200" y="28" width="95" height="22" rx="11" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="1" />
    <text x="247" y="43" text-anchor="middle" class="badge" fill="#c7d2fe">CANDIDATE</text>

    <!-- Title -->
    <text x="24" y="105" class="card-title" fill="#818cf8">Smart Job Discovery</text>
    
    <!-- Description -->
    <text x="24" y="135" class="card-sub">Instant AI role matching, salary</text>
    <text x="24" y="155" class="card-sub">filters, experience tiers, and</text>
    <text x="24" y="175" class="card-sub">1-click resume applications.</text>
    
    <circle cx="280" cy="190" r="4" fill="#38bdf8" />
  </g>

  <!-- ================= CARD 2 ================= -->
  <g transform="translate(345, 10)">
    <rect width="310" height="215" rx="16" fill="url(#card2Grad)" stroke="url(#border2Grad)" stroke-width="2" />
    
    <!-- Top icon circle -->
    <circle cx="45" cy="45" r="22" fill="rgba(236, 72, 153, 0.25)" stroke="#ec4899" stroke-width="1.5" />
    <text x="45" y="52" text-anchor="middle" font-size="20">⚡</text>
    
    <!-- Badge -->
    <rect x="195" y="28" width="100" height="22" rx="11" fill="rgba(236, 72, 153, 0.2)" stroke="#f472b6" stroke-width="1" />
    <text x="245" y="43" text-anchor="middle" class="badge" fill="#fbcfe8">RECRUITER</text>

    <!-- Title -->
    <text x="24" y="105" class="card-title" fill="#f472b6">Recruiter ATS Suite</text>
    
    <!-- Description -->
    <text x="24" y="135" class="card-sub">Multi-stage pipeline tracking,</text>
    <text x="24" y="155" class="card-sub">applicant review, notes sync,</text>
    <text x="24" y="175" class="card-sub">and stage progression triggers.</text>

    <circle cx="280" cy="190" r="4" fill="#a855f7" />
  </g>

  <!-- ================= CARD 3 ================= -->
  <g transform="translate(680, 10)">
    <rect width="310" height="215" rx="16" fill="url(#card3Grad)" stroke="url(#border3Grad)" stroke-width="2" />
    
    <!-- Top icon circle -->
    <circle cx="45" cy="45" r="22" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="45" y="52" text-anchor="middle" font-size="20">📧</text>
    
    <!-- Badge -->
    <rect x="200" y="28" width="95" height="22" rx="11" fill="rgba(6, 182, 212, 0.2)" stroke="#22d3ee" stroke-width="1" />
    <text x="247" y="43" text-anchor="middle" class="badge" fill="#a5f3fc">AUTOMATION</text>

    <!-- Title -->
    <text x="24" y="105" class="card-title" fill="#22d3ee">Interview Dispatch</text>
    
    <!-- Description -->
    <text x="24" y="135" class="card-sub">Automated branded HTML mailer</text>
    <text x="24" y="155" class="card-sub">with meeting calendar links,</text>
    <text x="24" y="175" class="card-sub">notes, and candidate updates.</text>

    <circle cx="280" cy="190" r="4" fill="#10b981" />
  </g>
</svg>
