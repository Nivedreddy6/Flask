<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="230">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Border Animation -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#06b6d4;#6366f1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#06b6d4;#6366f1;#ec4899" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#6366f1;#ec4899;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- GitHub Button Gradient -->
    <linearGradient id="ghBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Avatar Glow -->
    <filter id="avatarGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=Fira+Code:wght@600;700;800&amp;display=swap');

    .author-name { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 900; fill: #ffffff; letter-spacing: -0.5px; }
    .author-role { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; fill: #a5b4fc; }
    .author-bio { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .btn-text-main { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 800; fill: #ffffff; letter-spacing: 0.3px; }
    .btn-text-sub { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; }
    
    .pulse-heart {
      animation: heartBeat 1.5s ease-in-out infinite;
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .btn-pulse {
      animation: btnGlow 3s ease-in-out infinite alternate;
    }
    @keyframes btnGlow {
      0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
      100% { filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.7)); }
    }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="230" rx="18" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="2" />

  <!-- Avatar Section (Left) -->
  <g transform="translate(45, 45)">
    <circle cx="70" cy="70" r="62" fill="none" stroke="url(#footerBorder)" stroke-width="3" filter="url(#avatarGlow)" />
    <circle cx="70" cy="70" r="56" fill="#1e1b4b" />
    <text x="70" y="82" text-anchor="middle" font-size="42">👨‍💻</text>
    <circle cx="115" cy="115" r="9" fill="#10b981" stroke="#0b0f19" stroke-width="2.5" />
  </g>

  <!-- Profile Details Section (Center) -->
  <g transform="translate(210, 42)">
    <!-- Badge Pill -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="1" />
    <text x="80" y="16" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#c7d2fe">PROJECT CREATOR</text>

    <!-- Name & Handle -->
    <text x="0" y="55" class="author-name">
      Nived Reddy <tspan font-family="'Fira Code', monospace" font-size="16" font-weight="600" fill="#38bdf8">(@Nivedreddy6)</tspan>
    </text>

    <!-- Title / Bio -->
    <text x="0" y="80" class="author-role">Full-Stack Software Engineer • Python / Flask &amp; React Architect</text>
    <text x="0" y="104" class="author-bio">Passionate about building scalable recruitment engines, intuitive cloud tools, and modern reactive interfaces.</text>

    <!-- Action Buttons Row -->
    <g transform="translate(0, 122)">
      <!-- 🌟 BUTTON 1: PRIMARY GITHUB BUTTON -->
      <g class="btn-pulse">
        <!-- Button Background with Gradient Frame -->
        <rect width="230" height="36" rx="18" fill="#0f172a" stroke="url(#ghBtnGrad)" stroke-width="2" />
        <rect x="2" y="2" width="226" height="32" rx="16" fill="rgba(30, 27, 75, 0.6)" />
        
        <!-- Official GitHub Octocat Icon (Scaled Path) -->
        <g transform="translate(14, 8) scale(1.25)">
          <path fill="#ffffff" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </g>
        
        <text x="44" y="23" class="btn-text-main">View GitHub Profile</text>
        <text x="204" y="23" font-size="14" fill="#38bdf8">➔</text>
      </g>

      <!-- BUTTON 2: STAR REPO -->
      <g transform="translate(245, 0)">
        <rect width="145" height="36" rx="18" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" />
        <text x="16" y="23" font-size="15">⭐</text>
        <text x="38" y="23" class="btn-text-sub" fill="#fbbf24">Star on GitHub</text>
      </g>

      <!-- BUTTON 3: MIT LICENSE -->
      <g transform="translate(405, 0)">
        <rect width="125" height="36" rx="18" fill="#18181b" stroke="#10b981" stroke-width="1.5" />
        <text x="16" y="23" font-size="15">📜</text>
        <text x="38" y="23" class="btn-text-sub" fill="#34d399">MIT License</text>
      </g>
    </g>
  </g>

  <!-- Right Heart Message -->
  <g transform="translate(850, 115)">
    <text x="0" y="0" text-anchor="middle" font-size="32" class="pulse-heart">❤️</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#94a3b8">CRAFTED WITH</text>
    <text x="0" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#ec4899">PASSION</text>
  </g>
</svg>
