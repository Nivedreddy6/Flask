<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="680">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="deepBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#ec4899;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#a855f7;#ec4899" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardCand" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#042f2e"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="cardRec" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2e1065"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Fira+Code:wght@600;700&amp;display=swap');

    .section-title { font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 800; letter-spacing: -0.5px; }
    .item-h { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .item-body { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .route-pill { font-family: 'Fira Code', monospace; font-size: 10.5px; font-weight: 700; }
    .badge-status { font-family: 'Fira Code', monospace; font-size: 9.5px; font-weight: 700; }
  </style>

  <!-- Container -->
  <rect width="1000" height="680" rx="18" fill="url(#deepBg)" stroke="url(#deepBorder)" stroke-width="2" />

  <!-- ================= SECTION 1: CANDIDATE CAREER SUITE ================= -->
  <g transform="translate(20, 20)">
    <rect width="465" height="635" rx="14" fill="url(#cardCand)" stroke="#0d9488" stroke-width="1.5" />
    
    <!-- Header -->
    <circle cx="35" cy="35" r="18" fill="rgba(45, 212, 191, 0.2)" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="35" y="41" text-anchor="middle" font-size="16">🎯</text>
    <text x="65" y="42" class="section-title" fill="#2dd4bf">Candidate Experience Portal</text>
    <line x1="20" y1="68" x2="445" y2="68" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Feature 1: Job Discovery -->
    <g transform="translate(20, 85)">
      <rect x="0" y="0" width="425" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1" />
      <text x="15" y="24" class="item-h">🔍 Smart Job Discovery Feed</text>
      <rect x="270" y="8" width="140" height="22" rx="11" fill="rgba(45, 212, 191, 0.15)" stroke="#2dd4bf" stroke-width="1" />
      <text x="340" y="23" class="route-pill" fill="#5eead4" text-anchor="middle">/seeker/jobs</text>
      <text x="15" y="48" class="item-body">Multi-criteria filtering by title, department (Frontend, AI,</text>
      <text x="15" y="66" class="item-body">Backend), remote status, and competitive pay scales.</text>
    </g>

    <!-- Feature 2: 1-Click Application -->
    <g transform="translate(20, 180)">
      <rect x="0" y="0" width="425" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
      <text x="15" y="24" class="item-h">⚡ 1-Click Resume Application</text>
      <rect x="260" y="8" width="150" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
      <text x="335" y="23" class="route-pill" fill="#7dd3fc" text-anchor="middle">/seeker/job/&lt;id&gt;</text>
      <text x="15" y="48" class="item-body">Instant submission with PDF, DOCX, or TXT resume</text>
      <text x="15" y="66" class="item-body">upload and automated file integrity checks.</text>
    </g>

    <!-- Feature 3: Candidate Dashboard & Stepper -->
    <g transform="translate(20, 275)">
      <rect x="0" y="0" width="425" height="110" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1" />
      <text x="15" y="24" class="item-h">📊 Real-Time Application Tracker</text>
      <rect x="250" y="8" width="160" height="22" rx="11" fill="rgba(99, 102, 241, 0.15)" stroke="#818cf8" stroke-width="1" />
      <text x="330" y="23" class="route-pill" fill="#a5b4fc" text-anchor="middle">/seeker/dashboard</text>
      <text x="15" y="48" class="item-body">Visual multi-stage progress tracking with live status pills:</text>
      
      <!-- Mini Stage Pills -->
      <g transform="translate(15, 60)">
        <rect x="0" y="0" width="65" height="20" rx="10" fill="#3b82f6" />
        <text x="32" y="14" class="badge-status" fill="#fff" text-anchor="middle">Applied</text>

        <rect x="75" y="0" width="75" height="20" rx="10" fill="#8b5cf6" />
        <text x="112" y="14" class="badge-status" fill="#fff" text-anchor="middle">Reviewing</text>

        <rect x="160" y="0" width="80" height="20" rx="10" fill="#ec4899" />
        <text x="200" y="14" class="badge-status" fill="#fff" text-anchor="middle">Shortlisted</text>

        <rect x="250" y="0" width="75" height="20" rx="10" fill="#f59e0b" />
        <text x="287" y="14" class="badge-status" fill="#fff" text-anchor="middle">Interview</text>

        <rect x="335" y="0" width="55" height="20" rx="10" fill="#10b981" />
        <text x="362" y="14" class="badge-status" fill="#fff" text-anchor="middle">Hired</text>
      </g>
    </g>

    <!-- Feature 4: Learning & Upskilling -->
    <g transform="translate(20, 395)">
      <rect x="0" y="0" width="425" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
      <text x="15" y="24" class="item-h">📚 Career Upskilling Hub</text>
      <rect x="290" y="8" width="120" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#34d399" stroke-width="1" />
      <text x="350" y="23" class="route-pill" fill="#6ee7b7" text-anchor="middle">/learning</text>
      <text x="15" y="48" class="item-body">Curated engineering roadmap, system design guides, and</text>
      <text x="15" y="66" class="item-body">interview coding challenges.</text>
    </g>

    <!-- Feature 5: People Network -->
    <g transform="translate(20, 490)">
      <rect x="0" y="0" width="425" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" />
      <text x="15" y="24" class="item-h">👥 Tech Community Directory</text>
      <rect x="300" y="8" width="110" height="22" rx="11" fill="rgba(245, 158, 11, 0.15)" stroke="#fbbf24" stroke-width="1" />
      <text x="355" y="23" class="route-pill" fill="#fde68a" text-anchor="middle">/people</text>
      <text x="15" y="48" class="item-body">Professional peer networking to connect with software</text>
      <text x="15" y="66" class="item-body">engineers, recruiters, and tech leaders.</text>
    </g>
  </g>

  <!-- ================= SECTION 2: RECRUITER ATS SUITE ================= -->
  <g transform="translate(515, 20)">
    <rect width="465" height="635" rx="14" fill="url(#cardRec)" stroke="#9333ea" stroke-width="1.5" />
    
    <!-- Header -->
    <circle cx="35" cy="35" r="18" fill="rgba(192, 132, 252, 0.2)" stroke="#c084fc" stroke-width="1.5" />
    <text x="35" y="41" text-anchor="middle" font-size="16">🏢</text>
    <text x="65" y="42" class="section-title" fill="#c084fc">Recruiter ATS &amp; Hiring Suite</text>
    <line x1="20" y1="68" x2="445" y2="68" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Feature 1: Recruiter Dashboard -->
    <g transform="translate(20, 85)">
      <rect x="0" y="0" width="425" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1" />
      <text x="15" y="24" class="item-h">📊 ATS Command Dashboard</text>
      <rect x="240" y="8" width="170" height="22" rx="11" fill="rgba(168, 85, 247, 0.15)" stroke="#c084fc" stroke-width="1" />
      <text x="325" y="23" class="route-pill" fill="#d8b4fe" text-anchor="middle">/recruiter/dashboard</text>
      <text x="15" y="48" class="item-body">Live hiring velocity KPIs tracking active jobs, applicants,</text>
      <text x="15" y="66" class="item-body">shortlist conversion rates, and upcoming interviews.</text>
    </g>

    <!-- Feature 2: Post Job Wizard -->
    <g transform="translate(20, 180)">
      <rect x="0" y="0" width="425" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(244, 114, 182, 0.2)" stroke-width="1" />
      <text x="15" y="24" class="item-h">➕ Multi-Tag Job Post Wizard</text>
      <rect x="250" y="8" width="160" height="22" rx="11" fill="rgba(236, 72, 153, 0.15)" stroke="#f472b6" stroke-width="1" />
      <text x="330" y="23" class="route-pill" fill="#fbcfe8" text-anchor="middle">/recruiter/post_job</text>
      <text x="15" y="48" class="item-body">Create listings with custom salary ranges ($120k-$160k),</text>
      <text x="15" y="66" class="item-body">department tags, and experience criteria.</text>
    </g>

    <!-- Feature 3: Candidate ATS Table -->
    <g transform="translate(20, 275)">
      <rect x="0" y="0" width="425" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(251, 146, 60, 0.2)" stroke-width="1" />
      <text x="15" y="24" class="item-h">📑 Candidate Pipeline Table</text>
      <rect x="230" y="8" width="180" height="22" rx="11" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1" />
      <text x="320" y="23" class="route-pill" fill="#fed7aa" text-anchor="middle">/recruiter/applications</text>
      <text x="15" y="48" class="item-body">Interactive ATS table with instant status transitions</text>
      <text x="15" y="66" class="item-body">and authenticated candidate resume streaming.</text>
    </g>

    <!-- Feature 4: Interview Scheduler -->
    <g transform="translate(20, 370)">
      <rect x="0" y="0" width="425" height="100" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(234, 179, 8, 0.2)" stroke-width="1" />
      <text x="15" y="24" class="item-h">📅 Automated Interview Scheduler</text>
      <rect x="270" y="8" width="140" height="22" rx="11" fill="rgba(234, 179, 8, 0.15)" stroke="#facc15" stroke-width="1" />
      <text x="340" y="23" class="route-pill" fill="#fef08a" text-anchor="middle">/interview/modal</text>
      <text x="15" y="48" class="item-body">Set meeting date, time, Google Meet/Zoom video URL, and</text>
      <text x="15" y="66" class="item-body">custom notes. Dispatches instant branded HTML emails!</text>
    </g>

    <!-- Feature 5: Company Branding -->
    <g transform="translate(20, 480)">
      <rect x="0" y="0" width="425" height="85" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
      <text x="15" y="24" class="item-h">🏛 Company Profile &amp; Brand Hub</text>
      <rect x="220" y="8" width="190" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
      <text x="315" y="23" class="route-pill" fill="#7dd3fc" text-anchor="middle">/recruiter/company_profile</text>
      <text x="15" y="48" class="item-body">Custom employer branding with logo showcase, culture</text>
      <text x="15" y="66" class="item-body">highlights, website links, and active vacancies list.</text>
    </g>
  </g>
</svg>
