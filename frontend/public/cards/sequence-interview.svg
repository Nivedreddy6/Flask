<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="seqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="seqBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#3b82f6;#10b981;#6366f1" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#3b82f6;#10b981;#6366f1;#ec4899" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#10b981;#6366f1;#ec4899;#3b82f6" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Arrow Marker Defs -->
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Fira+Code:wght@500;600;700&amp;display=swap');

    .actor-box { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .actor-sub { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: 600; fill: #94a3b8; text-anchor: middle; }
    .step-num { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 800; fill: #ffffff; }
    .msg-text { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600; fill: #e2e8f0; }
    .code-pill { font-family: 'Fira Code', monospace; font-size: 10.5px; font-weight: 600; fill: #38bdf8; }
    
    .lifeline { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4,4; }
    
    .flow-line {
      stroke-width: 2;
      stroke-dasharray: 6,4;
      animation: dashSeq 1.2s linear infinite;
    }

    @keyframes dashSeq {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Container -->
  <rect width="1000" height="480" rx="18" fill="url(#seqBg)" stroke="url(#seqBorder)" stroke-width="2" />

  <!-- Top Badge -->
  <g transform="translate(30, 20)">
    <rect width="400" height="26" rx="13" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#818cf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#c7d2fe">AUTOMATED INTERVIEW SCHEDULING SEQUENCE</text>
  </g>

  <!-- Lifelines -->
  <!-- Actor 1: Recruiter (X=110) -->
  <line x1="110" y1="105" x2="110" y2="445" class="lifeline" />
  <!-- Actor 2: React 19 Frontend (X=310) -->
  <line x1="310" y1="105" x2="310" y2="445" class="lifeline" />
  <!-- Actor 3: Flask Backend (X=520) -->
  <line x1="520" y1="105" x2="520" y2="445" class="lifeline" />
  <!-- Actor 4: SQLite DB (X=730) -->
  <line x1="730" y1="105" x2="730" y2="445" class="lifeline" />
  <!-- Actor 5: SMTP Mailer (X=900) -->
  <line x1="900" y1="105" x2="900" y2="445" class="lifeline" />

  <!-- ================= ACTOR CARDS ================= -->
  <!-- 1. Recruiter -->
  <g transform="translate(35, 55)">
    <rect width="150" height="48" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="75" y="24" class="actor-box">👤 Recruiter</text>
    <text x="75" y="40" class="actor-sub">Web Client</text>
  </g>

  <!-- 2. React 19 -->
  <g transform="translate(230, 55)">
    <rect width="160" height="48" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="1.5" />
    <text x="80" y="24" class="actor-box">⚛️ React 19 SPA</text>
    <text x="80" y="40" class="actor-sub">:5173 Vite Client</text>
  </g>

  <!-- 3. Flask Server -->
  <g transform="translate(440, 55)">
    <rect width="160" height="48" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
    <text x="80" y="24" class="actor-box">⚡ Flask Server</text>
    <text x="80" y="40" class="actor-sub">:5000 REST API</text>
  </g>

  <!-- 4. SQLite DB -->
  <g transform="translate(660, 55)">
    <rect width="140" height="48" rx="10" fill="#431407" stroke="#ea580c" stroke-width="1.5" />
    <text x="70" y="24" class="actor-box">💾 SQLite DB</text>
    <text x="70" y="40" class="actor-sub">SQLAlchemy ORM</text>
  </g>

  <!-- 5. SMTP Mailer -->
  <g transform="translate(830, 55)">
    <rect width="140" height="48" rx="10" fill="#4c0519" stroke="#e11d48" stroke-width="1.5" />
    <text x="70" y="24" class="actor-box">📧 SMTP Mailer</text>
    <text x="70" y="40" class="actor-sub">Flask-Mail</text>
  </g>

  <!-- ================= STEPS & MESSAGES ================= -->
  
  <!-- Step 1: Recruiter -> React 19 (Y=145) -->
  <g transform="translate(0, 140)">
    <circle cx="110" cy="0" r="10" fill="#6366f1" />
    <text x="110" y="4" text-anchor="middle" class="step-num">1</text>
    <line x1="120" y1="0" x2="300" y2="0" stroke="#818cf8" class="flow-line" marker-end="url(#arrowIndigo)" />
    <text x="210" y="-8" text-anchor="middle" class="msg-text">Click "Schedule Interview"</text>
  </g>

  <!-- Step 2: React Internal (Y=195) -->
  <g transform="translate(0, 195)">
    <circle cx="310" cy="0" r="10" fill="#0284c7" />
    <text x="310" y="4" text-anchor="middle" class="step-num">2</text>
    <path d="M 310 0 C 355 -15, 355 15, 316 10" stroke="#38bdf8" stroke-width="1.8" fill="none" marker-end="url(#arrowIndigo)" />
    <text x="365" y="4" class="msg-text">Open modal: Date, Time &amp; Video Link</text>
  </g>

  <!-- Step 3: React -> Flask (Y=250) -->
  <g transform="translate(0, 250)">
    <circle cx="310" cy="0" r="10" fill="#059669" />
    <text x="310" y="4" text-anchor="middle" class="step-num">3</text>
    <line x1="320" y1="0" x2="510" y2="0" stroke="#34d399" class="flow-line" marker-end="url(#arrowEmerald)" />
    <rect x="340" y="-22" width="150" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.8" />
    <text x="415" y="-10" text-anchor="middle" class="code-pill">POST /api/applications/id/interview</text>
  </g>

  <!-- Step 4: Flask -> SQLite DB (Y=305) -->
  <g transform="translate(0, 305)">
    <circle cx="520" cy="0" r="10" fill="#ea580c" />
    <text x="520" y="4" text-anchor="middle" class="step-num">4</text>
    <line x1="530" y1="0" x2="720" y2="0" stroke="#fb923c" class="flow-line" marker-end="url(#arrowAmber)" />
    <text x="625" y="-8" text-anchor="middle" class="msg-text">UPDATE status = 'Interview Scheduled'</text>
  </g>

  <!-- Step 5: Flask -> SMTP (Y=360) -->
  <g transform="translate(0, 360)">
    <circle cx="520" cy="0" r="10" fill="#e11d48" />
    <text x="520" y="4" text-anchor="middle" class="step-num">5</text>
    <line x1="530" y1="0" x2="890" y2="0" stroke="#f43f5e" class="flow-line" marker-end="url(#arrowPink)" />
    <text x="710" y="-8" text-anchor="middle" class="msg-text">Send HTML Calendar Invitation to Candidate</text>
  </g>

  <!-- Step 6: Flask -> React -> Recruiter Response (Y=415) -->
  <g transform="translate(0, 415)">
    <circle cx="520" cy="0" r="10" fill="#10b981" />
    <text x="520" y="4" text-anchor="middle" class="step-num">6</text>
    <line x1="510" y1="0" x2="120" y2="0" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowEmerald)" />
    <rect x="235" y="-22" width="180" height="18" rx="4" fill="rgba(52, 211, 153, 0.2)" stroke="#34d399" stroke-width="0.8" />
    <text x="325" y="-10" text-anchor="middle" class="code-pill">HTTP 200 OK + Updated Pipeline</text>
  </g>

</svg>
