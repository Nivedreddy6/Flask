<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="dirBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#8b5cf6;#ec4899;#f59e0b;#10b981" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="33%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#8b5cf6;#ec4899;#f59e0b;#10b981;#06b6d4" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="66%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#f59e0b;#10b981;#06b6d4;#8b5cf6;#ec4899" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#10b981;#06b6d4;#ec4899;#f59e0b;#8b5cf6" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Row Gradients -->
    <linearGradient id="rowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.22)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.04)" />
    </linearGradient>
    <linearGradient id="rowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.22)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.04)" />
    </linearGradient>
    <linearGradient id="rowGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.22)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.04)" />
    </linearGradient>
    <linearGradient id="rowGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(244, 63, 94, 0.22)" />
      <stop offset="100%" stop-color="rgba(244, 63, 94, 0.04)" />
    </linearGradient>
    <linearGradient id="rowGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.22)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.04)" />
    </linearGradient>
    <linearGradient id="rowGrad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.22)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.04)" />
    </linearGradient>
    <linearGradient id="rowGrad7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(234, 179, 8, 0.22)" />
      <stop offset="100%" stop-color="rgba(234, 179, 8, 0.04)" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=Fira+Code:wght@600;700&amp;display=swap');

    .header-text { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 800; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; }
    .portal-name { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 800; fill: #ffffff; }
    .url-text { font-family: 'Fira Code', monospace; font-size: 11.5px; font-weight: 700; }
    .stack-badge { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; }
    .status-text { font-family: 'Fira Code', monospace; font-size: 10.5px; font-weight: 800; text-transform: uppercase; }

    .glow-live { animation: glowLiveAnim 2s infinite ease-in-out; }
    @keyframes glowLiveAnim {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Card Background -->
  <rect width="1000" height="480" rx="22" fill="url(#dirBg)" stroke="url(#dirBorder)" stroke-width="2.5" />

  <!-- Top Title Bar -->
  <g transform="translate(30, 20)">
    <rect width="450" height="34" rx="17" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="18" cy="17" r="6" fill="#06b6d4" class="glow-live" />
    <text x="36" y="22" font-family="'Fira Code', monospace" font-size="12.5" font-weight="700" fill="#67e8f9">⚡ DIRECT URL QUICK-LAUNCH DIRECTORY</text>
  </g>

  <!-- Right Pill: Target Vercel Domain -->
  <g transform="translate(680, 20)">
    <rect width="290" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#34d399" />
    <text x="32" y="22" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#a7f3d0">flask-five-mauve.vercel.app</text>
  </g>

  <!-- Table Column Headers -->
  <g transform="translate(30, 72)">
    <text x="20" y="0" class="header-text">DESTINATION PORTAL</text>
    <text x="320" y="0" class="header-text">LIVE TARGET URL</text>
    <text x="640" y="0" class="header-text">CORE STACK</text>
    <text x="840" y="0" class="header-text">SYSTEM STATUS</text>
  </g>

  <!-- ROW 1: Main Web Portal (Emerald) -->
  <g transform="translate(30, 85)">
    <rect width="940" height="48" rx="12" fill="url(#rowGrad1)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.2" />
    <circle cx="28" cy="24" r="14" fill="#10b981" />
    <text x="28" y="29" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">🏛️</text>
    <text x="56" y="29" class="portal-name">Main Web Portal</text>
    
    <rect x="310" y="10" width="290" height="28" rx="7" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="325" y="28" class="url-text" fill="#34d399">flask-five-mauve.vercel.app/</text>
    
    <rect x="630" y="12" width="80" height="24" rx="6" fill="#065f46" />
    <text x="670" y="28" class="stack-badge" fill="#6ee7b7" text-anchor="middle">Flask 3.0</text>
    <rect x="715" y="12" width="70" height="24" rx="6" fill="#1e293b" />
    <text x="750" y="28" class="stack-badge" fill="#94a3b8" text-anchor="middle">Jinja2</text>

    <rect x="830" y="12" width="95" height="24" rx="12" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1" />
    <circle cx="844" cy="24" r="4" fill="#34d399" />
    <text x="856" y="28" class="status-text" fill="#a7f3d0">ONLINE</text>
  </g>

  <!-- ROW 2: React ATS Suite (Cyan/Sky) -->
  <g transform="translate(30, 140)">
    <rect width="940" height="48" rx="12" fill="url(#rowGrad2)" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1.2" />
    <circle cx="28" cy="24" r="14" fill="#06b6d4" />
    <text x="28" y="29" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">⚡</text>
    <text x="56" y="29" class="portal-name">React 19 ATS Suite</text>
    
    <rect x="310" y="10" width="290" height="28" rx="7" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
    <text x="325" y="28" class="url-text" fill="#38bdf8">/react  •  /applications</text>
    
    <rect x="630" y="12" width="80" height="24" rx="6" fill="#0e7490" />
    <text x="670" y="28" class="stack-badge" fill="#67e8f9" text-anchor="middle">React 19</text>
    <rect x="715" y="12" width="60" height="24" rx="6" fill="#4338ca" />
    <text x="745" y="28" class="stack-badge" fill="#c7d2fe" text-anchor="middle">Vite 8</text>

    <rect x="830" y="12" width="95" height="24" rx="12" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="1" />
    <circle cx="844" cy="24" r="4" fill="#38bdf8" />
    <text x="856" y="28" class="status-text" fill="#bae6fd">&lt; 1 MS</text>
  </g>

  <!-- ROW 3: Verified Job Board (Purple) -->
  <g transform="translate(30, 195)">
    <rect width="940" height="48" rx="12" fill="url(#rowGrad3)" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1.2" />
    <circle cx="28" cy="24" r="14" fill="#8b5cf6" />
    <text x="28" y="29" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">💼</text>
    <text x="56" y="29" class="portal-name">Explore Jobs Board</text>
    
    <rect x="310" y="10" width="290" height="28" rx="7" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1" />
    <text x="325" y="28" class="url-text" fill="#c084fc">/jobs  •  /jobs/&lt;id&gt;</text>
    
    <rect x="630" y="12" width="95" height="24" rx="6" fill="#581c87" />
    <text x="677" y="28" class="stack-badge" fill="#e9d5ff" text-anchor="middle">21+ Positions</text>
    <rect x="730" y="12" width="60" height="24" rx="6" fill="#1e293b" />
    <text x="760" y="28" class="stack-badge" fill="#cbd5e1" text-anchor="middle">Salary</text>

    <rect x="830" y="12" width="95" height="24" rx="12" fill="rgba(139, 92, 246, 0.25)" stroke="#8b5cf6" stroke-width="1" />
    <circle cx="844" cy="24" r="4" fill="#c084fc" />
    <text x="856" y="28" class="status-text" fill="#ede9fe">1-CLICK</text>
