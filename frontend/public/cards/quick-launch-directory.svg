    <rect width="940" height="48" rx="12" fill="url(#rowGrad4)" stroke="rgba(244, 63, 94, 0.5)" stroke-width="1.2" />
    <circle cx="28" cy="24" r="14" fill="#f43f5e" />
    <text x="28" y="29" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">🔐</text>
    <text x="56" y="29" class="portal-name">Sign In &amp; Auth Hub</text>
    
    <rect x="310" y="10" width="290" height="28" rx="7" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
    <text x="325" y="28" class="url-text" fill="#fb7185">/login  •  /login/google</text>
    
    <rect x="630" y="12" width="90" height="24" rx="6" fill="#881337" />
    <text x="675" y="28" class="stack-badge" fill="#fecdd3" text-anchor="middle">OAuth 2.0</text>
    <rect x="725" y="12" width="60" height="24" rx="6" fill="#1e293b" />
    <text x="755" y="28" class="stack-badge" fill="#cbd5e1" text-anchor="middle">Google</text>

    <rect x="830" y="12" width="95" height="24" rx="12" fill="rgba(244, 63, 94, 0.25)" stroke="#f43f5e" stroke-width="1" />
    <circle cx="844" cy="24" r="4" fill="#fb7185" />
    <text x="856" y="28" class="status-text" fill="#ffe4e6">SECURE</text>
  </g>

  <!-- ROW 5: Candidate Registration (Amber) -->
  <g transform="translate(30, 305)">
    <rect width="940" height="48" rx="12" fill="url(#rowGrad5)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.2" />
    <circle cx="28" cy="24" r="14" fill="#f59e0b" />
    <text x="28" y="29" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">📝</text>
    <text x="56" y="29" class="portal-name">Join Now / Register</text>
    
    <rect x="310" y="10" width="290" height="28" rx="7" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
    <text x="325" y="28" class="url-text" fill="#fbbf24">/register</text>
    
    <rect x="630" y="12" width="85" height="24" rx="6" fill="#78350f" />
    <text x="672" y="28" class="stack-badge" fill="#fde68a" text-anchor="middle">Seeker Role</text>
    <rect x="720" y="12" width="80" height="24" rx="6" fill="#78350f" />
    <text x="760" y="28" class="stack-badge" fill="#fde68a" text-anchor="middle">Recruiter</text>

    <rect x="830" y="12" width="95" height="24" rx="12" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="1" />
    <circle cx="844" cy="24" r="4" fill="#fbbf24" />
    <text x="856" y="28" class="status-text" fill="#fef3c7">INSTANT</text>
  </g>

  <!-- ROW 6: People & Mentors Directory (Indigo) -->
  <g transform="translate(30, 360)">
    <rect width="940" height="48" rx="12" fill="url(#rowGrad6)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.2" />
    <circle cx="28" cy="24" r="14" fill="#6366f1" />
    <text x="28" y="29" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">👥</text>
    <text x="56" y="29" class="portal-name">People &amp; Mentors</text>
    
    <rect x="310" y="10" width="290" height="28" rx="7" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <text x="325" y="28" class="url-text" fill="#a5b4fc">/people  •  /top-content</text>
    
    <rect x="630" y="12" width="85" height="24" rx="6" fill="#312e81" />
    <text x="672" y="28" class="stack-badge" fill="#c7d2fe" text-anchor="middle">Directory</text>
    <rect x="720" y="12" width="80" height="24" rx="6" fill="#1e293b" />
    <text x="760" y="28" class="stack-badge" fill="#94a3b8" text-anchor="middle">Insights</text>

    <rect x="830" y="12" width="95" height="24" rx="12" fill="rgba(99, 102, 241, 0.25)" stroke="#6366f1" stroke-width="1" />
    <circle cx="844" cy="24" r="4" fill="#818cf8" />
    <text x="856" y="28" class="status-text" fill="#e0e7ff">ACTIVE</text>
  </g>

  <!-- ROW 7: Flask Serverless REST API (Golden Yellow) -->
  <g transform="translate(30, 415)">
    <rect width="940" height="48" rx="12" fill="url(#rowGrad7)" stroke="rgba(234, 179, 8, 0.5)" stroke-width="1.2" />
    <circle cx="28" cy="24" r="14" fill="#eab308" />
    <text x="28" y="29" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle" fill="#000000">🔌</text>
    <text x="56" y="29" class="portal-name">Flask Serverless API</text>
    
    <rect x="310" y="10" width="290" height="28" rx="7" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1" />
    <text x="325" y="28" class="url-text" fill="#fde047">/api/status  •  /api/jobs</text>
    
    <rect x="630" y="12" width="90" height="24" rx="6" fill="#713f12" />
    <text x="675" y="28" class="stack-badge" fill="#fef08a" text-anchor="middle">Python 3.12</text>
    <rect x="725" y="12" width="80" height="24" rx="6" fill="#1e293b" />
    <text x="765" y="28" class="stack-badge" fill="#94a3b8" text-anchor="middle">Serverless</text>

    <rect x="830" y="12" width="95" height="24" rx="12" fill="rgba(234, 179, 8, 0.25)" stroke="#eab308" stroke-width="1" />
    <circle cx="844" cy="24" r="4" fill="#fde047" />
    <text x="856" y="28" class="status-text" fill="#fef9c3">100% UP</text>
