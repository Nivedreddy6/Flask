<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320">
  <defs>
    <!-- Recruiter Card Gradient -->
    <linearGradient id="recruiterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="recruiterBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Candidate Card Gradient -->
    <linearGradient id="candidateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="candidateBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <style>
    .header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 21px; font-weight: 800; letter-spacing: -0.5px; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 700; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #cbd5e1; font-weight: 400; }
  </style>

  <!-- ================= RECRUITER SUITE ================= -->
  <g transform="translate(10, 10)">
    <rect width="480" height="300" rx="16" fill="url(#recruiterGrad)" stroke="url(#recruiterBorder)" stroke-width="2" />
    
    <!-- Title Section -->
    <circle cx="45" cy="45" r="20" fill="rgba(129, 140, 248, 0.2)" stroke="#818cf8" stroke-width="1.5" />
    <text x="45" y="52" text-anchor="middle" font-size="18">🏢</text>
    <text x="80" y="52" class="header-text" fill="#c7d2fe">Recruiter Operations Suite</text>

    <!-- Step 1 -->
    <g transform="translate(30, 90)">
      <circle cx="10" cy="10" r="10" fill="#6366f1" />
      <text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
      <text x="30" y="10" class="item-title" fill="#a5b4fc">Job Post Creation &amp; Broadcasting</text>
      <text x="30" y="26" class="item-desc">Define tags, salary ranges ($120k-$160k), and roles.</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(30, 140)">
      <circle cx="10" cy="10" r="10" fill="#a855f7" />
      <text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
      <text x="30" y="10" class="item-title" fill="#d8b4fe">Candidate Pipeline Kanban</text>
      <text x="30" y="26" class="item-desc">Review applicant resumes and advance candidate stages.</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(30, 190)">
      <circle cx="10" cy="10" r="10" fill="#ec4899" />
      <text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
      <text x="30" y="10" class="item-title" fill="#fbcfe8">Automated Interview Scheduling</text>
      <text x="30" y="26" class="item-desc">Set date, time, Google Meet link, and trigger email alerts.</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(30, 240)">
      <circle cx="10" cy="10" r="10" fill="#06b6d4" />
      <text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4</text>
      <text x="30" y="10" class="item-title" fill="#a5f3fc">Hiring Conversion Metrics</text>
      <text x="30" y="26" class="item-desc">Track active listings, total applicants, and hiring velocity.</text>
    </g>
  </g>

  <!-- ================= CANDIDATE SUITE ================= -->
  <g transform="translate(510, 10)">
    <rect width="480" height="300" rx="16" fill="url(#candidateGrad)" stroke="url(#candidateBorder)" stroke-width="2" />
    
    <!-- Title Section -->
    <circle cx="45" cy="45" r="20" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="45" y="52" text-anchor="middle" font-size="18">🎯</text>
    <text x="80" y="52" class="header-text" fill="#67e8f9">Candidate Career Journey</text>

    <!-- Step 1 -->
    <g transform="translate(30, 90)">
      <circle cx="10" cy="10" r="10" fill="#06b6d4" />
      <text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
      <text x="30" y="10" class="item-title" fill="#67e8f9">Smart Job Discovery Feed</text>
      <text x="30" y="26" class="item-desc">Filter roles by keywords, compensation tier, and location.</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(30, 140)">
      <circle cx="10" cy="10" r="10" fill="#10b981" />
      <text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
      <text x="30" y="10" class="item-title" fill="#6ee7b7">1-Click Resume Applications</text>
      <text x="30" y="26" class="item-desc">Upload PDF/DOCX resumes with instant verification.</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(30, 190)">
      <circle cx="10" cy="10" r="10" fill="#3b82f6" />
      <text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
      <text x="30" y="10" class="item-title" fill="#93c5fd">Real-Time Stage Tracker</text>
      <text x="30" y="26" class="item-desc">Visual stepper for review, shortlist, and interview stages.</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(30, 240)">
      <circle cx="10" cy="10" r="10" fill="#8b5cf6" />
      <text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4</text>
      <text x="30" y="10" class="item-title" fill="#c4b5fd">Learning &amp; Community Hub</text>
      <text x="30" y="26" class="item-desc">Access career upskilling courses and engineering networks.</text>
    </g>
  </g>
</svg>
