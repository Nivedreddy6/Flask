<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 48" width="100%" height="48">
  <defs>
    <linearGradient id="typePillBgBackend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#172554" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="typeBorderBackend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;display=swap');

    .prompt-sym-be {
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      font-weight: 700;
      fill: #38bdf8;
    }

    .type-text-be {
      font-family: 'Fira Code', monospace;
      font-size: 14.5px;
      font-weight: 700;
      dominant-baseline: middle;
    }

    .line1 {
      fill: #38bdf8;
      animation: cycle1 9s ease-in-out infinite;
    }

    .line2 {
      fill: #818cf8;
      animation: cycle2 9s ease-in-out infinite;
    }

    .line3 {
      fill: #f472b6;
      animation: cycle3 9s ease-in-out infinite;
    }

    .cursor-be {
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      font-weight: 700;
      fill: #38bdf8;
      animation: blinkCursorBe 0.8s infinite;
    }

    @keyframes cycle1 {
      0%, 30% { opacity: 1; transform: translateY(0px); }
      33%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes cycle2 {
      0%, 33% { opacity: 0; transform: translateY(4px); }
      36%, 63% { opacity: 1; transform: translateY(0px); }
      66%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes cycle3 {
      0%, 66% { opacity: 0; transform: translateY(4px); }
      69%, 96% { opacity: 1; transform: translateY(0px); }
      100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes blinkCursorBe {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Background Pill -->
  <rect x="2" y="2" width="746" height="44" rx="22" fill="url(#typePillBgBackend)" stroke="url(#typeBorderBackend)" stroke-width="1.5" />

  <!-- Prompt Icon -->
  <g transform="translate(24, 25)">
    <text x="0" y="5" class="prompt-sym-be">❯</text>
  </g>

  <!-- Animated Typing Lines (Centered) -->
  <g transform="translate(48, 25)">
    <!-- Line 1 -->
    <text x="0" y="0" class="type-text-be line1">⚡ Flask 3.0 REST API &amp; SQLAlchemy ORM</text>
    
    <!-- Line 2 -->
    <text x="0" y="0" class="type-text-be line2">🔐 JWT Token Auth &amp; Password Hashing</text>
    
    <!-- Line 3 -->
    <text x="0" y="0" class="type-text-be line3">📧 Flask-Mail Automated Interview Scheduler</text>
  </g>

  <!-- Blinking Cursor -->
  <text x="500" y="29" class="cursor-be">█</text>
</svg>
