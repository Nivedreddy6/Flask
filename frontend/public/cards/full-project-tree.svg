<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="680">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fullTreeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <!-- Animated Multi-Color Border -->
    <linearGradient id="fullTreeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#ec4899;#10b981;#f59e0b;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#10b981;#f59e0b;#38bdf8;#818cf8;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#f59e0b;#38bdf8;#818cf8;#ec4899;#10b981" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#38bdf8;#818cf8;#ec4899;#10b981;#f59e0b" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Headers -->
    <linearGradient id="gFullBe" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="gFullFe" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Fira+Code:wght@500;600;700&amp;display=swap');

    .card-hdr-txt { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .folder-tag { font-family: 'Fira Code', monospace; font-size: 11.5px; font-weight: 700; fill: #fbbf24; }
    .file-tag-py { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #34d399; }
    .file-tag-js { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #60a5fa; }
    .file-tag-svg { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #f472b6; }
    .file-tag-html { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #fb923c; }
    .anno-txt { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500; fill: #94a3b8; }

    /* Animated Pulses */
    .pulse-dot-cyan { animation: pCyan 2s ease-in-out infinite alternate; }
    .pulse-dot-green { animation: pGreen 2s ease-in-out infinite alternate; }
    .pulse-dot-blue { animation: pBlue 2s ease-in-out infinite alternate; }
    .pulse-dot-gold { animation: pGold 2s ease-in-out infinite alternate; }

    @keyframes pCyan { 0% { opacity: 0.4; filter: drop-shadow(0 0 2px #38bdf8); } 100% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); } }
    @keyframes pGreen { 0% { opacity: 0.4; filter: drop-shadow(0 0 2px #10b981); } 100% { opacity: 1; filter: drop-shadow(0 0 8px #10b981); } }
    @keyframes pBlue { 0% { opacity: 0.4; filter: drop-shadow(0 0 2px #3b82f6); } 100% { opacity: 1; filter: drop-shadow(0 0 8px #3b82f6); } }
    @keyframes pGold { 0% { opacity: 0.4; filter: drop-shadow(0 0 2px #f59e0b); } 100% { opacity: 1; filter: drop-shadow(0 0 8px #f59e0b); } }

    /* Folder Glow Animation */
    .folder-glow { animation: fGlow 2.5s ease-in-out infinite alternate; }
    @keyframes fGlow {
      0% { filter: drop-shadow(0 0 1px rgba(251, 191, 36, 0.4)); }
      100% { filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.9)); }
    }

    /* Live Dash Flow on Tree Connectors */
    .tree-beam {
      stroke: #38bdf8;
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
      animation: beamRun 1.5s linear infinite;
    }
    .tree-beam-green {
      stroke: #10b981;
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
      animation: beamRun 1.5s linear infinite;
    }
    @keyframes beamRun {
      from { stroke-dashoffset: 16; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Container -->
  <rect width="1000" height="680" rx="18" fill="url(#fullTreeBg)" stroke="url(#fullTreeBorder)" stroke-width="2" />

  <!-- Top Banner Title -->
  <g transform="translate(30, 20)">
    <rect width="490" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#38bdf8" class="pulse-dot-cyan" />
    <text x="32" y="18" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#bae6fd">FULL PROJECT DIRECTORY &amp; SUBFOLDER ARCHITECTURE</text>
  </g>

  <!-- Top Right Badges -->
  <g transform="translate(680, 20)">
    <rect width="135" height="28" rx="14" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="1" />
    <circle cx="14" cy="14" r="3.5" fill="#10b981" class="pulse-dot-green" />
    <text x="75" y="18" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#6ee7b7">Flask 3.0 REST</text>
    <g transform="translate(145, 0)">
      <rect width="145" height="28" rx="14" fill="rgba(59, 130, 246, 0.18)" stroke="#3b82f6" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#3b82f6" class="pulse-dot-blue" />
      <text x="80" y="18" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#93c5fd">React 19 + Vite 8</text>
    </g>
  </g>

  <!-- ================= LEFT COLUMN: FULL BACKEND TREE ================= -->
  <g transform="translate(30, 65)">
    <rect width="455" height="590" rx="12" fill="#0c172a" stroke="#059669" stroke-width="1.4" />
    <rect width="455" height="34" rx="12" fill="url(#gFullBe)" />
    <circle cx="20" cy="17" r="4.5" fill="#6ee7b7" class="pulse-dot-green" />
    <text x="34" y="22" class="card-hdr-txt">📁 backend/ — Python 3.12 Flask REST Engine</text>

    <!-- Animated branch line -->
    <line x1="20" y1="48" x2="20" y2="520" class="tree-beam-green" opacity="0.4" />

    <!-- Tree items -->
    <g transform="translate(20, 48)">
      <!-- Root backend files -->
      <g>
        <circle cx="6" cy="12" r="2.5" fill="#10b981" />
        <text x="14" y="16" class="file-tag-py">app.py</text>
        <text x="145" y="16" class="anno-txt">WSGI app, CORS &amp; REST routing</text>
      </g>
      <g>
        <circle cx="6" cy="34" r="2.5" fill="#10b981" />
        <text x="14" y="38" class="file-tag-py">models.py</text>
        <text x="145" y="38" class="anno-txt">SQLAlchemy 6 relational entities</text>
      </g>
      <g>
        <circle cx="6" cy="56" r="2.5" fill="#10b981" />
        <text x="14" y="60" class="file-tag-py">database.py</text>
        <text x="145" y="60" class="anno-txt">DB initializer &amp; mock data seeder</text>
      </g>
      <g>
        <circle cx="6" cy="78" r="2.5" fill="#10b981" />
        <text x="14" y="82" class="file-tag-py">email_service.py</text>
        <text x="160" y="82" class="anno-txt">SMTP automated interview mailer</text>
      </g>
      <g>
        <circle cx="6" cy="100" r="2.5" fill="#10b981" />
        <text x="14" y="104" class="file-tag-py">job_portal.db</text>
        <text x="145" y="104" class="anno-txt">SQLite zero-config local database</text>
      </g>
      <g>
        <circle cx="6" cy="122" r="2.5" fill="#10b981" />
        <text x="14" y="126" class="file-tag-py">requirements.txt</text>
        <text x="160" y="126" class="anno-txt">Flask, SQLAlchemy, CORS packages</text>
      </g>

      <!-- Subfolder: routes/ -->
      <g class="folder-glow">
        <rect x="-4" y="138" width="130" height="20" rx="4" fill="rgba(245, 158, 11, 0.12)" />
        <text x="0" y="152" class="folder-tag">📁 routes/</text>
        <text x="135" y="152" class="anno-txt">Modular REST API Controllers</text>
      </g>
      <text x="16" y="172" class="file-tag-py">├── auth_api.py</text><text x="175" y="172" class="anno-txt">Login, register &amp; session auth</text>
      <text x="16" y="192" class="file-tag-py">├── jobs_api.py</text><text x="175" y="192" class="anno-txt">Search, filter &amp; job vacancy CRUD</text>
      <text x="16" y="212" class="file-tag-py">├── applications_api.py</text><text x="195" y="212" class="anno-txt">ATS pipeline &amp; submissions</text>
      <text x="16" y="232" class="file-tag-py">└── status_api.py</text><text x="175" y="232" class="anno-txt">Candidate status transition hooks</text>

      <!-- Subfolder: static/ -->
      <g class="folder-glow">
        <rect x="-4" y="244" width="130" height="20" rx="4" fill="rgba(245, 158, 11, 0.12)" />
        <text x="0" y="258" class="folder-tag">📁 static/</text>
        <text x="135" y="258" class="anno-txt">Public Assets &amp; User Storage</text>
      </g>
      <text x="16" y="278" class="folder-tag">├── 📁 uploads/resumes/</text><text x="195" y="278" class="anno-txt">Uploaded candidate PDFs</text>
      <text x="16" y="298" class="folder-tag">├── 📁 uploads/emails/</text><text x="195" y="298" class="anno-txt">Sent HTML invite logs</text>
      <text x="16" y="318" class="file-tag-py">├── css/style.css</text><text x="175" y="318" class="anno-txt">Server-rendered stylesheets</text>
      <text x="16" y="338" class="file-tag-py">└── js/main.js</text><text x="175" y="338" class="anno-txt">Server-rendered client scripts</text>

      <!-- Subfolder: templates/ -->
      <g class="folder-glow">
        <rect x="-4" y="350" width="140" height="20" rx="4" fill="rgba(245, 158, 11, 0.12)" />
        <text x="0" y="364" class="folder-tag">📁 templates/</text>
        <text x="145" y="364" class="anno-txt">Jinja2 Fallback View Templates</text>
      </g>
      <text x="16" y="384" class="file-tag-html">├── auth/</text><text x="175" y="384" class="anno-txt">login.html, register.html</text>
      <text x="16" y="404" class="file-tag-html">├── recruiter/</text><text x="175" y="404" class="anno-txt">dashboard, post_job, schedule, viewer</text>
      <text x="16" y="424" class="file-tag-html">├── seeker/</text><text x="175" y="424" class="anno-txt">dashboard, jobs, job_detail</text>
      <text x="16" y="444" class="file-tag-html">└── base.html</text><text x="175" y="444" class="anno-txt">base.html, 404.html, 500.html</text>
    </g>

    <!-- Bottom summary tag -->
    <rect x="20" y="535" width="415" height="38" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1" />
    <circle cx="36" cy="554" r="4" fill="#10b981" class="pulse-dot-green" />
    <text x="50" y="558" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#6ee7b7">⚡ REST API • Flask 3.0 • SQLite &amp; PostgreSQL • SMTP</text>
  </g>

  <!-- ================= RIGHT COLUMN: FULL FRONTEND TREE ================= -->
  <g transform="translate(515, 65)">
    <rect width="455" height="590" rx="12" fill="#0b172a" stroke="#2563eb" stroke-width="1.4" />
    <rect width="455" height="34" rx="12" fill="url(#gFullFe)" />
    <circle cx="20" cy="17" r="4.5" fill="#60a5fa" class="pulse-dot-blue" />
    <text x="34" y="22" class="card-hdr-txt">📁 frontend/ — React 19 + Vite 8 SPA Client</text>

    <!-- Animated branch line -->
    <line x1="20" y1="48" x2="20" y2="520" class="tree-beam" opacity="0.4" />

    <!-- Tree items -->
    <g transform="translate(20, 48)">
      <!-- Root frontend files -->
      <g>
        <circle cx="6" cy="12" r="2.5" fill="#38bdf8" />
        <text x="14" y="16" class="file-tag-js">package.json</text>
        <text x="145" y="16" class="anno-txt">React 19, Lucide, Vite configs</text>
      </g>
      <g>
        <circle cx="6" cy="34" r="2.5" fill="#38bdf8" />
        <text x="14" y="38" class="file-tag-js">vite.config.ts</text>
        <text x="145" y="38" class="anno-txt">Vite dev server &amp; API reverse proxy</text>
      </g>
      <g>
        <circle cx="6" cy="56" r="2.5" fill="#38bdf8" />
        <text x="14" y="60" class="file-tag-js">index.html</text>
        <text x="145" y="60" class="anno-txt">HTML5 entry point &amp; Google Fonts</text>
      </g>
      <g>
        <circle cx="6" cy="78" r="2.5" fill="#38bdf8" />
        <text x="14" y="82" class="file-tag-js">.oxlintrc.json</text>
        <text x="145" y="82" class="anno-txt">Sub-millisecond Rust Oxlint linter</text>
      </g>

      <!-- Subfolder: src/ -->
      <g class="folder-glow">
        <rect x="-4" y="94" width="130" height="20" rx="4" fill="rgba(245, 158, 11, 0.12)" />
        <text x="0" y="108" class="folder-tag">📁 src/</text>
        <text x="135" y="108" class="anno-txt">Core React 19 Component Tree</text>
      </g>
      <text x="16" y="128" class="file-tag-js">├── App.jsx</text><text x="165" y="128" class="anno-txt">Discovery feed &amp; ATS dashboard</text>
      <text x="16" y="148" class="file-tag-js">├── index.css</text><text x="165" y="148" class="anno-txt">Glassmorphism tokens &amp; neon FX</text>
      <text x="16" y="168" class="file-tag-js">├── main.jsx</text><text x="165" y="168" class="anno-txt">ReactDOM root concurrent render</text>
      <text x="16" y="188" class="folder-tag">├── 📁 components/</text><text x="175" y="188" class="anno-txt">Modular UI Components</text>
      <text x="32" y="208" class="file-tag-js">│   ├── Navbar.jsx</text><text x="205" y="208" class="anno-txt">Dual-role navigation bar</text>
      <text x="32" y="228" class="file-tag-js">│   ├── ApplicationsTable.jsx</text><text x="245" y="228" class="anno-txt">ATS pipeline</text>
      <text x="32" y="248" class="file-tag-js">│   ├── ATSKanbanBoard.jsx</text><text x="245" y="248" class="anno-txt">Kanban &amp; drawer</text>
      <text x="32" y="268" class="file-tag-js">│   └── Analytics &amp; Banner</text><text x="240" y="268" class="anno-txt">Metrics &amp; ticker</text>
      <text x="16" y="288" class="folder-tag">└── 📁 pages/</text><text x="175" y="288" class="anno-txt">DashboardPage, ApplicationsPage</text>

      <!-- Subfolder: public/ -->
      <g class="folder-glow">
        <rect x="-4" y="304" width="130" height="20" rx="4" fill="rgba(245, 158, 11, 0.12)" />
        <text x="0" y="318" class="folder-tag">📁 public/</text>
        <text x="135" y="318" class="anno-txt">Static Assets &amp; Documentation SVGs</text>
      </g>
      <text x="16" y="338" class="file-tag-svg">├── banner.svg</text><text x="175" y="338" class="anno-txt">Hero banner with gradient mesh</text>
      <text x="16" y="358" class="file-tag-svg">├── workflow.svg</text><text x="175" y="358" class="anno-txt">Full-stack dataflow pipeline</text>
      <text x="16" y="378" class="folder-tag">├── 📁 cards/</text><text x="175" y="378" class="anno-txt">16 Animated Documentation Cards</text>
      <text x="32" y="398" class="file-tag-svg">│   ├── system-architecture.svg, sequence-interview.svg</text>
      <text x="32" y="418" class="file-tag-svg">│   ├── database-schema.svg, backend-services.svg</text>
      <text x="32" y="438" class="file-tag-svg">│   └── overview-cards.svg, terminal-quickstart.svg</text>
      <text x="16" y="458" class="folder-tag">└── 📁 headers/</text><text x="175" y="458" class="anno-txt">8 Vibrant Section Header SVGs</text>
    </g>

    <!-- Bottom summary tag -->
    <rect x="20" y="535" width="415" height="38" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="36" cy="554" r="4" fill="#38bdf8" class="pulse-dot-blue" />
    <text x="50" y="558" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#7dd3fc">⚛️ React 19 • Vite 8 • Glassmorphism • Oxlint</text>
  </g>
</svg>
