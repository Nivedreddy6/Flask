<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Animated Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1; #a855f7; #ec4899; #06b6d4; #6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7; #ec4899; #06b6d4; #6366f1; #a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4; #6366f1; #a855f7; #ec4899; #06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: -1.5px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite;
    }
    .float-orb {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-20px) translateX(15px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="400" rx="20" fill="url(#grid)" />

  <!-- Animated Glowing Orbs -->
  <circle cx="200" cy="120" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)" class="float-orb" />
  <circle cx="1000" cy="280" r="160" fill="#a855f7" opacity="0.15" filter="url(#glow)" class="float-orb" />
  <circle cx="600" cy="360" r="120" fill="#06b6d4" opacity="0.12" filter="url(#glow)" class="pulse-circle" />

  <!-- Flowing Waves / Curves at Bottom -->
  <path d="M 0 340 Q 300 290 600 330 T 1200 310 L 1200 400 L 0 400 Z" fill="url(#accentGrad)" opacity="0.2">
    <animate attributeName="d" 
      values="M 0 340 Q 300 290 600 330 T 1200 310 L 1200 400 L 0 400 Z;
              M 0 330 Q 300 350 600 310 T 1200 340 L 1200 400 L 0 400 Z;
              M 0 340 Q 300 290 600 330 T 1200 310 L 1200 400 L 0 400 Z"
      dur="7s" repeatCount="indefinite" />
  </path>
  <path d="M 0 360 Q 300 330 600 370 T 1200 340 L 1200 400 L 0 400 Z" fill="url(#accentGrad)" opacity="0.3">
    <animate attributeName="d" 
      values="M 0 360 Q 300 330 600 370 T 1200 340 L 1200 400 L 0 400 Z;
              M 0 350 Q 300 380 600 340 T 1200 360 L 1200 400 L 0 400 Z;
              M 0 360 Q 300 330 600 370 T 1200 340 L 1200 400 L 0 400 Z"
      dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Central Glassmorphism Card Frame -->
  <rect x="100" y="45" width="1000" height="290" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Top Decorative Tech Pill -->
  <g transform="translate(470, 70)">
    <rect width="260" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="badge-text" fill="#c7d2fe">NEXT-GEN RECRUITMENT PORTAL</text>
  </g>

  <!-- Main Title with Gradient Fill -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <text class="title">
      JOB SPHERE <tspan fill="url(#accentGrad)">STUDIO</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" class="subtitle">
    Fast, Elegant &amp; Intelligent Full-Stack Job Application Ecosystem
  </text>

  <!-- Feature Badges -->
  <g transform="translate(230, 245)">
    <!-- Badge 1: React 19 -->
    <g transform="translate(0, 0)">
      <rect width="150" height="40" rx="20" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <circle cx="25" cy="20" r="7" fill="#61dafb" />
      <text x="44" y="25" class="badge-text">React 19 Core</text>
    </g>

    <!-- Badge 2: Vite 8 -->
    <g transform="translate(170, 0)">
      <rect width="140" height="40" rx="20" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
      <circle cx="25" cy="20" r="7" fill="#a855f7" />
      <text x="44" y="25" class="badge-text">Vite Fast HMR</text>
    </g>

    <!-- Badge 3: Glassmorphism UI -->
    <g transform="translate(330, 0)">
      <rect width="180" height="40" rx="20" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1" />
      <circle cx="25" cy="20" r="7" fill="#ec4899" />
      <text x="44" y="25" class="badge-text">Glassmorphism UI</text>
    </g>

    <!-- Badge 4: Flask API Sync -->
    <g transform="translate(530, 0)">
      <rect width="180" height="40" rx="20" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <circle cx="25" cy="20" r="7" fill="#06b6d4" />
      <text x="44" y="25" class="badge-text">Flask REST Proxy</text>
    </g>
  </g>
</svg>
